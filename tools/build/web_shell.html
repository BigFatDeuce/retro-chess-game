<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<!-- Écran de chargement : produit par tools/build/loading_runners.py depuis ce gabarit. -->
		<style>
@font-face { font-family: 'RCFredoka'; src: url(__FONT__) format('truetype'); font-display: block; }

html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: white; background-color: #0a0d1c; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }

#status {
	position: absolute; inset: 0; overflow: hidden;
	background: radial-gradient(ellipse at 50% 35%, #2a3766 0%, #151b38 52%, #080a16 100%);
	display: flex; flex-direction: column; justify-content: center; align-items: center;
	visibility: hidden; font-family: 'RCFredoka', 'Trebuchet MS', sans-serif;
	transition: opacity .4s ease;
}
#status::before { /* a faint chessboard far below, in perspective */
	content: ''; position: absolute; left: -50%; right: -50%; bottom: -40%; height: 70%;
	background: repeating-conic-gradient(rgba(255,255,255,.045) 0 25%, transparent 0 50%) 0 0 / 90px 90px;
	transform: perspective(500px) rotateX(58deg); transform-origin: 50% 100%;
	mask-image: linear-gradient(transparent, #000 60%); -webkit-mask-image: linear-gradient(transparent, #000 60%);
}
#status.leaving { opacity: 0; }
.star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff6d0; opacity: 0;
	animation: twinkle 3.6s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .85; transform: scale(1.6); } }

#logo { position: relative; width: min(64vw, 540px); max-height: 38vh; object-fit: contain;
	filter: drop-shadow(0 10px 22px rgba(0,0,0,.6)); animation: logo-float 3.4s ease-in-out infinite; }
@keyframes logo-float { 50% { transform: translateY(-7px) rotate(.5deg); } }

#stage { position: relative; width: min(82vw, 760px); height: 190px; margin-top: 1vh; }
.track { position: absolute; left: 0; right: 0; bottom: 18px; height: 24px; border-radius: 14px;
	background: #0d1024; border: 3px solid #c99a3c;
	box-shadow: inset 0 3px 7px rgba(0,0,0,.75), 0 0 0 2px #3b2a10, 0 6px 16px rgba(0,0,0,.55); overflow: hidden; }
.fill { height: 100%; width: calc(var(--p) * 100%); position: relative;
	background: repeating-conic-gradient(#f4e2b2 0 25%, #b98a4a 0 50%) 0 0 / 24px 24px;
	animation: slide 1.1s linear infinite; }
.fill::after { content: ''; position: absolute; inset: 0; background: linear-gradient(rgba(255,255,255,.35), transparent 45%, rgba(0,0,0,.25)); }
@keyframes slide { to { background-position: 24px 0; } }

.runner { position: absolute; left: calc(var(--p) * 100%); bottom: 42px; width: 0; height: 0; }
.runner .hop { position: absolute; left: 0; bottom: 0; }
.runner .sprite { position: absolute; background-repeat: no-repeat; }
.runner .shadow { position: absolute; left: -22px; bottom: -6px; width: 44px; height: 10px; border-radius: 50%;
	background: rgba(0,0,0,.4); }

#tofu .sprite { width: __TOFU_W__px; height: __TOFU_H__px; left: -__TOFU_OX__px; top: -__TOFU_OY__px;
	background-image: url(__TOFU_IMG__); background-size: calc(__TOFU_W__px * __TOFU_N__) __TOFU_H__px;
	animation: tofu-run __TOFU_MS__ms steps(__TOFU_N__) infinite; }
@keyframes tofu-run { to { background-position: calc(__TOFU_W__px * -__TOFU_N__) 0; } }
#tofu .hop { animation: hop 2.4s ease-in-out infinite; }
@keyframes hop { 0%, 68%, 100% { transform: translateY(0); } 76% { transform: translateY(-36px) rotate(-8deg); }
	85% { transform: translateY(-42px) rotate(7deg); } 93% { transform: translateY(0) scaleY(.86); } }

#bwork { margin-left: -170px; }
#bwork .sprite { width: __BWORK_W__px; height: __BWORK_H__px; left: -__BWORK_OX__px; top: -__BWORK_OY__px;
	background-image: url(__BWORK_IMG__); background-size: calc(__BWORK_W__px * __BWORK_N__) __BWORK_H__px;
	animation: bwork-run __BWORK_MS__ms steps(__BWORK_N__) infinite; }
@keyframes bwork-run { to { background-position: calc(__BWORK_W__px * -__BWORK_N__) 0; } }
#bwork .hop { animation: chase 3.2s ease-in-out infinite; }
@keyframes chase { 0%, 100% { transform: translateX(0); } 40% { transform: translateX(46px); }
	52% { transform: translateX(54px) translateY(-8px); } 62% { transform: translateX(40px); } }
#bwork .shadow { left: -38px; width: 76px; height: 12px; }

.bubble { position: absolute; left: 6px; bottom: 80px; white-space: nowrap; background: #fff6df; color: #2b2142;
	font-size: 15px; padding: 5px 11px; border-radius: 12px; box-shadow: 0 3px 8px rgba(0,0,0,.45);
	opacity: 0; transform: translateY(6px) scale(.9); transition: opacity .25s, transform .25s; }
.bubble::after { content: ''; position: absolute; left: 14px; bottom: -7px; border: 7px solid transparent;
	border-bottom: 0; border-top-color: #fff6df; }
.bubble.on { opacity: 1; transform: none; }
#bwork .bubble { bottom: 146px; left: -16px; }

#pct { position: relative; margin-top: 2px; font-size: 22px; color: #ffd98a; letter-spacing: 1px;
	text-shadow: 0 2px 0 #3b2a10, 0 0 12px rgba(255,190,80,.4); }
#tip { position: relative; margin-top: 10px; min-height: 1.4em; max-width: 86vw; text-align: center; font-size: 17px;
	color: #dfe3f6; text-shadow: 0 2px 3px rgba(0,0,0,.7); transition: opacity .35s; }
#tip.fade { opacity: 0; }

#status-notice { display: none; background-color: #3c2a4a; border-radius: .5rem; border: 1px solid #9b4a63; color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif; line-height: 1.3; margin: 1rem 2rem 0; overflow: hidden;
	padding: 1rem; text-align: center; z-index: 1; }
@media (max-height: 480px) { #logo { max-height: 30vh; } #stage { height: 170px; } #tip { font-size: 15px; } }
@media (prefers-reduced-motion: reduce) { #logo, #tofu .hop, #bwork .hop, .fill, .star { animation: none; } }
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="logo" src="__LOGO__" alt="Retro Chess">
			<div id="stage" style="--p: 0">
				<div class="track"><div class="fill"></div></div>
				<div class="runner" id="bwork"><div class="hop"><div class="shadow"></div><div class="sprite"></div></div><div class="bubble"></div></div>
				<div class="runner" id="tofu"><div class="hop"><div class="shadow"></div><div class="sprite"></div></div><div class="bubble"></div></div>
			</div>
			<div id="pct">0 %</div>
			<div id="tip"></div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');
	const stage = document.getElementById('stage');
	const pct = document.getElementById('pct');
	const tip = document.getElementById('tip');
	const en = !/^fr/i.test(navigator.language || '');
	const TIPS = en ? [
		'The Tofu is running to fetch the game…',
		'The Bwork is sure he will catch it this time.',
		'Setting up the pieces…',
		'The pawns are polishing their armour…',
		'The knight checks which way an L goes…',
		'The king insists on being protected. As always.',
		'Waking up the ten champions…',
		'A Tofu never castles. It just runs.',
	] : [
		'Le Tofu court chercher le jeu…',
		'Le Bwork est sûr de l\'attraper cette fois.',
		'On installe les pièces…',
		'Les pions astiquent leur armure…',
		'Le cavalier vérifie dans quel sens va le L…',
		'Le roi exige d\'être protégé. Comme toujours.',
		'On réveille les dix champions…',
		'Un Tofu ne roque jamais. Il court.',
	];
	const TOFU_SAYS = en ? ['Piou!', 'Too slow!', 'Catch me!', 'Check!'] : ['Piou !', 'Trop lent !', 'Attrape-moi !', 'Échec !'];
	const BWORK_SAYS = en ? ['Bwork!', 'Come back here!', 'Grrr!', 'My dinner!'] : ['Bwork !', 'Reviens ici !', 'Grrr !', 'Mon dîner !'];

	for (let i = 0; i < 26; i++) {
		const s = document.createElement('div');
		s.className = 'star';
		s.style.left = (Math.random() * 100) + '%';
		s.style.top = (Math.random() * 55) + '%';
		s.style.animationDelay = (Math.random() * 3.6) + 's';
		statusOverlay.appendChild(s);
	}

	let initializing = true;
	let statusMode = '';
	let target = 0;
	let shown = 0;
	let known = false;
	const started = performance.now();

	function frame(now) {
		if (!initializing) return;
		// without a known size the bar creeps towards 90 %, then the real figure takes over
		const goal = known ? target : 0.9 * (1 - Math.exp(-(now - started) / 9000));
		shown += (goal - shown) * 0.08;
		stage.style.setProperty('--p', shown.toFixed(4));
		pct.textContent = Math.floor(shown * 100) + ' %';
		requestAnimationFrame(frame);
	}

	let tipIndex = Math.floor(Math.random() * TIPS.length);
	function nextTip() {
		tip.classList.add('fade');
		setTimeout(() => { tipIndex = (tipIndex + 1) % TIPS.length; tip.textContent = TIPS[tipIndex]; tip.classList.remove('fade'); }, 350);
	}
	tip.textContent = TIPS[tipIndex];
	const tipTimer = setInterval(nextTip, 3300);

	function say(id, lines) {
		const b = document.querySelector('#' + id + ' .bubble');
		b.textContent = lines[Math.floor(Math.random() * lines.length)];
		b.classList.add('on');
		setTimeout(() => b.classList.remove('on'), 1300);
	}
	let turn = 0;
	const sayTimer = setInterval(() => { (turn++ % 2 ? say('bwork', BWORK_SAYS) : say('tofu', TOFU_SAYS)); }, 2300);

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			initializing = false;
			clearInterval(tipTimer);
			clearInterval(sayTimer);
			statusOverlay.classList.add('leaving');
			setTimeout(() => statusOverlay.remove(), 450);
			return;
		}
		statusOverlay.style.visibility = 'visible';
		stage.style.display = mode === 'progress' ? 'block' : 'none';
		pct.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		if (mode === 'progress') requestAnimationFrame(frame);
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		displayFailureNotice('Error\nThe following features required to run Godot projects on the Web are missing:\n' + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					known = true;
					target = Math.min(1, current / total);
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
